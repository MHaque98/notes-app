AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Notes App - Serverless backend with API Gateway, Lambda, and DynamoDB

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        NOTES_TABLE_NAME: !Ref NotesTable

Resources:
  # DynamoDB Table
  # Schema Design:
  # - Partition Key: id (String) - Unique identifier for each note
  # - Attributes (stored as items, DynamoDB is schemaless):
  #   * title (String) - Note title
  #   * content (String) - Note content/body
  #   * createdAt (String) - ISO 8601 timestamp when note was created
  #   * updatedAt (String) - ISO 8601 timestamp when note was last updated
  # - Global Secondary Index: CreatedAtIndex
  #   * Partition Key: createdAt (String) - For querying notes by date
  #   * Sort Key: id (String) - Ensures uniqueness and allows sorting
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CreatedAtIndex
          KeySchema:
            - AttributeName: createdAt
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: NotesApp
        - Key: Environment
          Value: !Ref AWS::StackName

  # API Gateway REST API
  NotesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Functions
  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: CreateNote
      CodeUri: .
      Handler: functions/createNote/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        CreateNoteApi:
          Type: Api
          Properties:
            RestApiId: !Ref NotesApi
            Path: /notes
            Method: post

  GetNoteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: GetNote
      CodeUri: .
      Handler: functions/getNote/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
      Events:
        GetNoteApi:
          Type: Api
          Properties:
            RestApiId: !Ref NotesApi
            Path: /notes/{id}
            Method: get

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: ListNotes
      CodeUri: .
      Handler: functions/listNotes/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
      Events:
        ListNotesApi:
          Type: Api
          Properties:
            RestApiId: !Ref NotesApi
            Path: /notes
            Method: get

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: UpdateNote
      CodeUri: .
      Handler: functions/updateNote/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        UpdateNoteApi:
          Type: Api
          Properties:
            RestApiId: !Ref NotesApi
            Path: /notes/{id}
            Method: put

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: DeleteNote
      CodeUri: .
      Handler: functions/deleteNote/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        DeleteNoteApi:
          Type: Api
          Properties:
            RestApiId: !Ref NotesApi
            Path: /notes/{id}
            Method: delete

Outputs:
  NotesApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${NotesApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
    Export:
      Name: NotesApiUrl

  NotesTableName:
    Description: DynamoDB Table Name
    Value: !Ref NotesTable
    Export:
      Name: NotesTableName

